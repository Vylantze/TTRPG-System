<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title"><title id="title">A six-sided die wearing a wizard hat</title>
<!-- Die: a five-pip front face and a shaded one-pip side. -->
<path d="M31 72 80 78 80 121 31 113Z" fill="#f4dfab" stroke="#193b35" stroke-width="5" stroke-linejoin="round"/>
<path d="m80 78 22-10v39l-22 14Z" fill="#d3b875" stroke="#193b35" stroke-width="5" stroke-linejoin="round"/>
<g fill="#193b35"><ellipse cx="43" cy="89" rx="4" ry="4.5"/><ellipse cx="68" cy="92" rx="4" ry="4.5"/><ellipse cx="55.5" cy="100" rx="4" ry="4.5"/><ellipse cx="43" cy="106" rx="4" ry="4.5"/><ellipse cx="68" cy="110" rx="4" ry="4.5"/><ellipse cx="91" cy="96" rx="3.5" ry="4.5"/></g>
<!-- The brim is behind the cone, so its rear edge cannot cross the hat. -->
<ellipse cx="64" cy="70" rx="49" ry="12" fill="#665099" stroke="#193b35" stroke-width="5"/>
<path d="M38 67C44 45 50 21 67 6c7 9 16 11 27 8-6 7-13 12-21 12 6 13 11 27 16 41-14 9-36 9-51 0Z" fill="#665099" stroke="#193b35" stroke-width="5" stroke-linejoin="round"/>
