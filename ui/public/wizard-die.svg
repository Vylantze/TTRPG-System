<path d="m61 29 2 6 6 2-6 2-2 6-2-6-6-2 6-2Z" fill="#f4dfab"/>
<path d="m105 34 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#bc9352"/>
</svg>